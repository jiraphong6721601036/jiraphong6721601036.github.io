<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Zombie Camp 3D Portfolio</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
    </style>
</head>

<body>

    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>


    const renderer = new THREE.WebGLRenderer({antialias: true});

    renderer.setSize( window.innerWidth,window.innerHeight);

    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputEncoding = THREE.sRGBEncoding;

    document.body.appendChild(renderer.domElement);



    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x899AD2);


    const camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
    );

    camera.position.set(0, 2, 5);
    camera.lookAt(0, 0, 0);


    const controls = new THREE.OrbitControls(camera,renderer.domElement);
    controls.enableDamping = true;
    controls.rotateSpeed = 0.5;
    controls.dampingFactor = 0.03;


    
    const directionalLight =new THREE.DirectionalLight(0xffffff,1.5);

    directionalLight.position.set(5,8,5);

    directionalLight.castShadow = true;

    scene.add(directionalLight);


    

    const ambientLight =new THREE.AmbientLight(0xffffff,0.7);
    scene.add(ambientLight);


    const fillLight = new THREE.DirectionalLight(0xffffff,0.3);
    fillLight.position.set(-5,4,-3);
    scene.add(fillLight);


    

   
        const texFloor = new THREE.TextureLoader().load('https://jiraphong6721601036.github.io/assets/red_brick_diff_1k.jpg', t => {
        });
        const matFloor = new THREE.MeshStandardMaterial({
            map: texFloor,
            doubleSided: true
        });
        const planeGeometry = new THREE.PlaneGeometry(10, 10);
        const plane = new THREE.Mesh(planeGeometry, matFloor);
        plane.rotation.x = -Math.PI / 2; 
        plane.receiveShadow = true;
        
        scene.add(plane);

    

        const loader = new THREE.GLTFLoader();
        loader.load('https://jiraphong6721601036.github.io/assets/medicaltent2.glb',(gltf) => {
        const model = gltf.scene;
        model.traverse((child) => {
                if (child.isMesh) {
                    child.receiveShadow = true;
                    child.castShadow = true;
                }
            });


            model.position.set(0,0,0);
            scene.add(model);
        });





    function animate() {

        requestAnimationFrame(
            animate
        );

        controls.update();

        renderer.render(
            scene,
            camera
        );

    }

    animate();




    window.addEventListener(
        'resize',
        () => {

            camera.aspect =
                window.innerWidth /
                window.innerHeight;

            camera.updateProjectionMatrix();

            renderer.setSize(
                window.innerWidth,
                window.innerHeight
            );

        }
    );

    window.addEventListener(
        'keydown',
        (event) => {

        }
    );

</script>

</body>
</html>
