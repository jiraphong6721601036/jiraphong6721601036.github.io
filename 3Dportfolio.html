<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>3D Portfolio</title>
  <style>
    html, body { height: 100%; margin: 0; overflow: hidden; }
    canvas { display: block; }
    #hint {
      position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
      padding: 8px 16px; border-radius: 999px;
      background: rgba(0,0,0,.45); color: #fff;
      font: 14px sans-serif; pointer-events: none; white-space: nowrap;
    }
    #backBtn {
      position: fixed; top: 16px; left: 16px; display: none;
      padding: 8px 18px; border: 0; border-radius: 999px;
      background: rgba(0,0,0,.55); color: #fff;
      font: 15px sans-serif; cursor: pointer;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/EXRLoader.js"></script>
</head>
<body>

<button id="backBtn">← กลับ</button>

<div id="hint">
  • ลากเพื่อหมุน&nbsp;&nbsp; • Scroll เพื่อซูม&nbsp;&nbsp; • คลิกวัตถุเพื่อดูรายละเอียด&nbsp;&nbsp; • กด Esc เพื่อกลับมุมเดิม
</div>

<script>
  const PICKABLE_TARGETS = {
    aboutme: 'aboutme',
    aboutboard: 'aboutme',
    projectboard: 'projecttable',
    projecttable: 'projecttable',
    skillboard: 'skill',
    skill: 'skill'
  };

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputEncoding = THREE.sRGBEncoding;
  document.body.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x899AD2);
  const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 1000);
  camera.position.set(0, 2, 10);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.rotateSpeed = 0.5;
  controls.dampingFactor = 0.03;

  const light = new THREE.DirectionalLight(0xffffff, 1.2);
  light.position.set(10.5, 8, 5);
  light.castShadow = true;
  light.shadow.bias = -0.0005;
  light.shadow.normalBias = 0.03;
  scene.add(light);

  const exrSkyboxUrl = 'https://dl.polyhaven.org/file/ph-assets/HDRIs/exr/1k/sunset_meadow_path_1k.exr';
  const pmrem = new THREE.PMREMGenerator(renderer);

  new THREE.EXRLoader().load(exrSkyboxUrl, (texture) => {
    scene.environment = pmrem.fromEquirectangular(texture).texture;
    texture.dispose();
  });

  const uniforms = {
    uTime: { value: 0.0 },
    uLightDir: { value: light.position.clone().normalize() }
  };

  const toonVertexShader = `
    varying vec3 vNormal;

    void main() {
      vNormal = normalize(mat3(modelMatrix) * normal);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `;

  const toonFragmentShader = `
    uniform vec3 uColor;
    uniform vec3 uLightDir;
    varying vec3 vNormal;

    void main() {
      vec3 N = normalize(vNormal);
      if (!gl_FrontFacing) N = -N;

      float diffuse = max(dot(N, normalize(uLightDir)), 0.0);
      diffuse = floor(diffuse * 8.0) / 8.0;

      vec3 color = uColor * (diffuse + 0.3);
      gl_FragColor = vec4(pow(color, vec3(1.0 / 2.2)), 1.0); // linear -> sRGB
    }
  `;

  const outlineMaterial = new THREE.ShaderMaterial({
    vertexShader: `
      void main() {
        vec4 p = modelMatrix * vec4(position, 1.0);
        p.xyz += normalize(mat3(modelMatrix) * normal) * 0.005;
        gl_Position = projectionMatrix * viewMatrix * p;
      }
    `,
    fragmentShader: `
      void main() { gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0); }
    `,
    side: THREE.BackSide
  });

  function applyCelShading(root) {
    const meshes = [];
    root.traverse((c) => { if (c.isMesh) meshes.push(c); });

    meshes.forEach((m) => {
      const old = m.material;
      m.material = new THREE.ShaderMaterial({
        vertexShader: toonVertexShader,
        fragmentShader: toonFragmentShader,
        uniforms: {
          uColor: { value: old.color.clone() },
          uLightDir: uniforms.uLightDir
        },
        side: old.side
      });
      m.add(new THREE.Mesh(m.geometry, outlineMaterial));
    });
  }

  const flameVertexShader = `
    uniform float uTime;

    void main() {
      vec3 pos = position;
      float h = clamp(pos.y, 0.0, 1.0); // โคนอยู่ที่ y = 0, ยิ่งสูงยิ่งแกว่งมาก

      pos.x = pos.x + sin(uTime * 5.0 + pos.y * 4.0) * 0.1 * h;

      gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
    }
  `;

  const flameFragmentShader = `
    uniform vec3 uColor;

    void main() {
      gl_FragColor = vec4(pow(uColor, vec3(1.0 / 2.2)), 1.0);
    }
  `;

  function makeFlame(root) {
    root.traverse((m) => {
      if (!m.isMesh) return;
      m.material = new THREE.ShaderMaterial({
        vertexShader: flameVertexShader,
        fragmentShader: flameFragmentShader,
        uniforms: {
          uTime: uniforms.uTime,
          uColor: { value: m.material.color.clone() }
        },
        side: THREE.DoubleSide
      });
      m.castShadow = false;
    });
  }

  const home_position = camera.position.clone();
  const home_target = controls.target.clone();
  const focus_target = controls.target.clone();
  const camera_goal = camera.position.clone();
  let moving = false;

  const backBtn = document.getElementById('backBtn');

  function lerp(a, b, t) {
    //return a+(b-a)*t; ในข้อสอบใช้อันนี้
    return ((1.0 - t) * a) + (t * b);
  }

  function resetView() {
    focus_target.copy(home_target);
    camera_goal.copy(home_position);
    moving = true;
    backBtn.style.display = 'none';
  }

  function zoomTo(target) {
    const box = new THREE.Box3().setFromObject(target);
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());

    const distance = Math.max(size.x, size.y, size.z) * 1.0;
    const dir = camera.position.clone().sub(center).normalize();

    focus_target.copy(center);
    camera_goal.copy(center).add(dir.multiplyScalar(distance));
    moving = true;
    backBtn.style.display = 'block';
  }

  backBtn.addEventListener('click', resetView);

  controls.addEventListener('start', () => { moving = false; });

  const pickables = [];
  const raycaster = new THREE.Raycaster();
  const pointer = new THREE.Vector2();

  function getPickableRoot(obj) {
    while (obj) {
      if (obj.name in PICKABLE_TARGETS) return obj;
      obj = obj.parent;
    }
    return null;
  }

  function onPick(e) {
    pointer.x = (e.clientX / innerWidth) * 2 - 1;
    pointer.y = -(e.clientY / innerHeight) * 2 + 1;

    raycaster.setFromCamera(pointer, camera);
    const hit = raycaster.intersectObjects(pickables, false)[0];
    if (!hit) return;

    const root = getPickableRoot(hit.object);
    const target = root && scene.getObjectByName(PICKABLE_TARGETS[root.name]);
    if (target) zoomTo(target);
  }

  new THREE.GLTFLoader().load('https://jiraphong6721601036.github.io/assets/3Dportfolio16.glb', (gltf) => {
    const model = gltf.scene;

    model.traverse((child) => {
      if (!child.isMesh) return;
      child.receiveShadow = true;
      child.castShadow = child.name !== 'Plane';
      pickables.push(child);
      if (child.material.isMeshStandardMaterial) child.material.envMapIntensity = 0.5;
    });

    const flames = model.getObjectByName('flames');
    if (flames) flames.children.forEach(makeFlame);

    const foxy = model.getObjectByName('foxy');
    if (foxy) applyCelShading(foxy);

    scene.add(model);
  });

  let down = { x: 0, y: 0 };
  renderer.domElement.addEventListener('pointerdown', (e) => { down = { x: e.clientX, y: e.clientY }; });
  renderer.domElement.addEventListener('pointerup', (e) => {
    if (Math.hypot(e.clientX - down.x, e.clientY - down.y) < 5) onPick(e);
  });

  addEventListener('keydown', (e) => { if (e.key === 'Escape') resetView(); });

  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  function animate(time) {
    uniforms.uTime.value = time * 0.001;

    if (moving) {
      controls.target.lerp(focus_target, 0.1);
      camera.position.x = lerp(camera.position.x, camera_goal.x, 0.02);
      camera.position.y = lerp(camera.position.y, camera_goal.y, 0.02);
      camera.position.z = lerp(camera.position.z, camera_goal.z, 0.02);

      if (camera.position.distanceTo(camera_goal) < 0.01 &&
          controls.target.distanceTo(focus_target) < 0.01) {
        moving = false;
      }
    }

    controls.update();
    renderer.render(scene, camera);
    requestAnimationFrame(animate);
  }

  requestAnimationFrame(animate);
</script>
</body>
</html>
