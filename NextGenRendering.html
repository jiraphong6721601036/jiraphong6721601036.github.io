<!DOCTYPE html>
<html>

<head>
    <title>Materials</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
    </style>
</head>

<body>
    
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/EXRLoader.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.7/dat.gui.min.js"></script>

    <script>

        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true; // Shadow
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const scene = new THREE.Scene();

        
        const camera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        camera.position.set(0, 2, 5);
        camera.lookAt(0, 0, 0);
        const controls = new THREE.OrbitControls(camera, renderer.domElement);

        

        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
        directionalLight.position.set(10, 10, 10);
        directionalLight.castShadow = true;
        scene.add(directionalLight);

        const exrSkyboxUrl = 'https://dl.polyhaven.org/file/ph-assets/HDRIs/exr/1k/sunset_meadow_path_1k.exr';
        const pmremGenerator = new THREE.PMREMGenerator(renderer);
        pmremGenerator.compileEquirectangularShader();

        new THREE.EXRLoader()
            .setDataType(THREE.UnsignedByteType)
            .load(exrSkyboxUrl, (texture) => {
                const skybox = pmremGenerator.fromEquirectangular(texture).texture;
                scene.background = skybox;
                scene.environment = skybox;

                texture.dispose();
                pmremGenerator.dispose();
            }, undefined, (error) => {
                console.error('Unable to load EXR skybox:', error);
            });



        //ใส่พื้น
        const texFloor = new THREE.TextureLoader().load('https://jiraphong6721601036.github.io/assets/red_brick_diff_1k.jpg', t => {
        });
        const matFloor = new THREE.MeshStandardMaterial({
            map: texFloor,
            doubleSided: true
        });
        const planeGeometry = new THREE.PlaneGeometry(10, 10);
        const plane = new THREE.Mesh(planeGeometry, matFloor);
        plane.rotation.x = -Math.PI / 2; 
        plane.receiveShadow = true;
        
        scene.add(plane);

        

        //load glb และใช้ pbr material
        const loader = new THREE.GLTFLoader();
        loader.load('https://jiraphong6721601036.github.io/assets/Hw3v7.glb', (gltf) => {
            const model = gltf.scene;
            model.traverse((child) => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                }
            });
            model.position.set(0, 0, 0);
            scene.add(model);
        });

        
        const gui = new dat.GUI({ width: 300 });

        const dirLightFolder = gui.addFolder('Directional Light');
        dirLightFolder.add(directionalLight.position, 'x', -20, 20, 0.1).name('Position X');
        dirLightFolder.add(directionalLight.position, 'y', 0, 20, 0.1).name('Position Y');
        dirLightFolder.add(directionalLight.position, 'z', -20, 20, 0.1).name('Position Z');
        dirLightFolder.add(directionalLight, 'intensity', 0, 5, 0.1).name('Intensity');
        dirLightFolder.addColor({ color: '#ffffff' }, 'color').name('Color').onChange((val) => {
            directionalLight.color.set(val);
        });
        dirLightFolder.open();

       

        
        function animate(t) {
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        animate(0);

        window.addEventListener('keydown', (event) => {

        });

    </script>

</body>

<style>
    body {
        margin: 0;
        overflow: hidden;
    }

    .dg.main.a {
        float: left !important;
        margin-left: 15px !important;
        margin-top: 15px !important;
    }

    .dg {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif !important;
        text-shadow: none !important;
    }

    .dg .c .slider {
        background: #2a2d34 !important;
        border-radius: 4px;
    }

    .dg .c .slider-fg {
        background: #149ceb !important;
        border-radius: 4px;
    }

    .dg li:not(.folder) {
        background: #1e2022 !important;
        border-bottom: 1px solid #2b2e31 !important;
        color: #eeeeee !important;
    }

    .dg li.title {
        background: #0137b4 !important; 
        color: #ffffff !important;
        font-weight: bold;
        border-left: 4px solid #38bdf8 !important;
    }

    .dg .cr.number input[type=text] {
        color: #ffffff !important;
        background: #00000070 !important;
        border-radius: 3px;
    }
</style>

</html>
