<!DOCTYPE html>
<html>
<head>
    <title>Raster Graphics Paint</title>
    <style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }
    body {
        font-family: sans-serif;
        background: #f0f0f0;
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
    }
    #toolbar {
        background: #333;
        padding: 10px;
        display: flex;
        gap: 15px;
        align-items: center;
        color: white;
        flex-wrap: wrap;
    }
    .control-group {
        display: flex;
        align-items: center;
        gap: 5px;
    }
    button {
        padding: 6px 12px;
        cursor: pointer;
        font-weight: bold;
    }
    button.active {
        background-color: #4CAF50;
        color: white;
        border: 1px solid #fff;
    }
    .canvas-container {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 10px;
        background: #ccc;
    }
    canvas {
        border: 2px solid #000;
        background: white;
        image-rendering: pixelated;
        cursor: crosshair;
        max-width: 100%;
        max-height: 100%;
        width: auto;
        height: auto;
        aspect-ratio: 4 / 3;
    }
</style>
</head>
<body>

<div id="toolbar">
    <div class="control-group">
        <strong>เครื่องมือ:</strong>
        <button id="btn-pencil" class="active" onclick="setTool('pencil')">ดินสอ</button>
        <button id="btn-line" onclick="setTool('line')">วาดเส้น</button>
        <button id="btn-rect" onclick="setTool('rect')">สี่เหลี่ยม</button>
        <button id="btn-circle" onclick="setTool('circle')">วงกลม</button>
        <button id="btn-eraser" onclick="setTool('eraser')">ยางลบ</button>
    </div>

    <div class="control-group">
        <strong>สี:</strong>
        <input type="color" id="colorPicker" value="#000000" onchange="updateColor(this.value)">
    </div>

    <div class="control-group">
    <strong>ความหนาเส้น:</strong>
    <!-- สไลเดอร์เลื่อนความหนา -->
    <input type="range" id="thicknessPicker" min="1" max="50" value="2" oninput="updateThickness(this.value)">
    
    <!-- ช่องพิมพ์ตัวเลขระบุความหนา -->
    <input type="number" id="thicknessNumber" min="1" max="50" value="2" style="width: 50px; text-align: center;" oninput="updateThickness(this.value)">
    <span>px</span>
    </div>
</div>

<div class="canvas-container">
<canvas id="canvas" width="2000" height="800"></canvas>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
let imageData = ctx.createImageData(W, H);
let pixels = imageData.data;

// ---------- เติมพื้นขาวตอนเริ่มต้น ----------
function fillAll(arr, r, g, b, a) {
    for (let i = 0; i < arr.length; i += 4) {
        arr[i] = r; arr[i+1] = g; arr[i+2] = b; arr[i+3] = a;
    }
}
fillAll(pixels, 255, 255, 255, 255);
ctx.putImageData(imageData, 0, 0);

// ---------- ฟังก์ชันวาดพื้นฐาน (มี bounds check) ----------
function putPixel(x, y, r, g, b, a = 255) {
    x = Math.round(x); y = Math.round(y);
    if (x < 0 || x >= W || y < 0 || y >= H) return;
    const idx = (y * W + x) * 4;
    pixels[idx] = r; pixels[idx+1] = g; pixels[idx+2] = b; pixels[idx+3] = a;
}

function drawLine(x1, y1, x2, y2, r, g, b, a = 255) {
    const dx = Math.abs(x2 - x1);
    const dy = Math.abs(y2 - y1);
    if (dx > dy) {
        const m = (y2 - y1) / (x2 - x1 || 1);
        const c = y1 - m * x1;
        for (let x = Math.min(x1, x2); x <= Math.max(x1, x2); x++) {
            putPixel(x, m * x + c, r, g, b, a);
        }
    } else {
        const m = (x2 - x1) / (y2 - y1 || 1);
        const c = x1 - m * y1;
        for (let y = Math.min(y1, y2); y <= Math.max(y1, y2); y++) {
            putPixel(m * y + c, y, r, g, b, a);
        }
    }
}

function drawrec(x1, y1, x2, y2, r, g, b, a = 255) {
    drawLine(x1, y1, x2, y1, r, g, b, a);
    drawLine(x2, y1, x2, y2, r, g, b, a);
    drawLine(x2, y2, x1, y2, r, g, b, a);
    drawLine(x1, y2, x1, y1, r, g, b, a);
}

function drawcircle(cx, cy, rx, ry, r, g, b, a = 255) {
    for (let y = -ry; y <= ry; y++) {
        for (let x = -rx; x <= rx; x++) {
            const d = (x*x)/(rx*rx) + (y*y)/(ry*ry);
            if (d <= 1 && d > (1 - 2/Math.max(rx, ry, 1))) {
                putPixel(cx + x, cy + y, r, g, b, a);
            }
        }
    }
}


function stampBrush(cx, cy, size, r, g, b, a) {
    const radius = Math.max(0, Math.floor(size / 2));
    if (radius === 0) { putPixel(cx, cy, r, g, b, a); return; }
    for (let y = -radius; y <= radius; y++) {
        for (let x = -radius; x <= radius; x++) {
            if (x*x + y*y <= radius*radius + radius) {
                putPixel(cx + x, cy + y, r, g, b, a);
            }
        }
    }
}
function drawThickLine(x1, y1, x2, y2, size, r, g, b, a) {
    const dist = Math.max(Math.abs(x2 - x1), Math.abs(y2 - y1), 1);
    for (let i = 0; i <= dist; i++) {
        const t = i / dist;
        stampBrush(x1 + (x2 - x1) * t, y1 + (y2 - y1) * t, size, r, g, b, a);
    }
}
function drawRectThick(x1, y1, x2, y2, size, r, g, b, a) {
    const left = Math.min(x1, x2), right = Math.max(x1, x2);
    const top = Math.min(y1, y2), bottom = Math.max(y1, y2);
    for (let y = top; y <= bottom; y++) {
        for (let x = left; x <= right; x++) {
            const minDist = Math.min(x - left, right - x, y - top, bottom - y);
            if (minDist < size) putPixel(x, y, r, g, b, a);
        }
    }
}
function drawCircleThick(cx, cy, rx, ry, size, r, g, b, a) {
    const rxIn = Math.max(0, rx - size);
    const ryIn = Math.max(0, ry - size);
    for (let y = -ry; y <= ry; y++) {
        for (let x = -rx; x <= rx; x++) {
            const dOut = (x*x)/(rx*rx) + (y*y)/(ry*ry);
            if (dOut > 1) continue;
            const dIn = (rxIn > 0 && ryIn > 0) ? (x*x)/(rxIn*rxIn) + (y*y)/(ryIn*ryIn) : 2;
            if (dIn > 1) putPixel(cx + x, cy + y, r, g, b, a);
        }
    }
}


let currentTool = 'pencil';
let r = 0, g = 0, b = 0;   
let thickness = 2;
let isDragging = false;
let startX = 0, startY = 0, previousMouseX = 0, previousMouseY = 0;
let snapshot = null; // ใช้เก็บภาพก่อนวาด เส้น/สี่เหลี่ยม/วงกลมระหว่างลาก


function setTool(tool) {
    currentTool = tool;
    document.querySelectorAll('#toolbar button').forEach(btn => btn.classList.remove('active'));
    document.getElementById('btn-' + tool).classList.add('active');
}

function updateColor(hex) {
    const n = parseInt(hex.slice(1), 16);
    r = (n >> 16) & 255;
    g = (n >> 8) & 255;
    b = n & 255;
}

function updateThickness(value) {
    // แปลงค่าเป็นตัวเลข และจำกัดให้อยู่ในช่วง 1 ถึง 50
    let val = parseInt(value, 10);
    if (isNaN(val)) val = 1;
    if (val < 1) val = 1;
    if (val > 50) val = 50;

    // อัปเดตตัวแปรความหนาสำหรับวาดภาพ
    thickness = val;

    // อัปเดตค่าของทั้ง Slider และ Input Number ให้ขยับตามกัน
    document.getElementById('thicknessPicker').value = val;
    document.getElementById('thicknessNumber').value = val;
}


function toScaledMouseCoords(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = W / rect.width;
    const scaleY = H / rect.height;
    return {
        x: (clientX - rect.left) * scaleX,
        y: (clientY - rect.top) * scaleY
    };
}

canvas.addEventListener('mousedown', function (event) {
    isDragging = true;
    const { x, y } = toScaledMouseCoords(event.clientX, event.clientY);
    startX = x; startY = y; previousMouseX = x; previousMouseY = y;

    if (currentTool === 'pencil' || currentTool === 'eraser') {
        const color = currentTool === 'eraser' ? [255, 255, 255] : [r, g, b];
        stampBrush(x, y, thickness, color[0], color[1], color[2]);
        ctx.putImageData(imageData, 0, 0);
    } else {
        // เครื่องมือรูปทรง: เก็บภาพปัจจุบันไว้พรีวิว
        snapshot = new Uint8ClampedArray(pixels);
    }
});

canvas.addEventListener('mousemove', function (event) {
    const { x, y } = toScaledMouseCoords(event.clientX, event.clientY);
    if (!isDragging) return;

    if (currentTool === 'pencil' || currentTool === 'eraser') {
        const color = currentTool === 'eraser' ? [255, 255, 255] : [r, g, b];
        drawThickLine(previousMouseX, previousMouseY, x, y, thickness, color[0], color[1], color[2]);
        previousMouseX = x; previousMouseY = y;
        ctx.putImageData(imageData, 0, 0);
    } else if (snapshot) {
       
        pixels.set(snapshot);
        if (currentTool === 'line') {
            drawThickLine(startX, startY, x, y, thickness, r, g, b);
        } else if (currentTool === 'rect') {
            drawRectThick(startX, startY, x, y, thickness, r, g, b);
        } else if (currentTool === 'circle') {
            const cx = (startX + x) / 2, cy = (startY + y) / 2;
            const rx = Math.max(1, Math.abs(x - startX) / 2);
            const ry = Math.max(1, Math.abs(y - startY) / 2);
            drawCircleThick(cx, cy, rx, ry, thickness, r, g, b);
        }
        ctx.putImageData(imageData, 0, 0);
    }
});

function endStroke() {
    isDragging = false;
    snapshot = null;
}
canvas.addEventListener('mouseup', endStroke);
canvas.addEventListener('mouseleave', endStroke);

</script>
</body>
</html>
